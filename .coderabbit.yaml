# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/*.min.js"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"
  request_tools:
    ast_grep:
      enabled: true

chat:
  auto_reply: true